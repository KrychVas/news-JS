<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta name="theme-color" content="#0d0f14" />
        <meta
            name="description"
            content="News Portal — адаптивна стрічка новин з понад сотні світових джерел, зібрана через News API."
        />
        <title>News Portal — стрічка новин</title>
    </head>
    <body>
        <div class="app">
            <header class="header">
                <div class="header__inner">
                    <a class="brand" href="./">
                        <span class="brand__mark" aria-hidden="true">N</span>
                        <span class="brand__name">News<span class="brand__accent">Portal</span></span>
                        <span class="header__badge" hidden>Демо-дані</span>
                    </a>
                    <p class="header__tagline">Стрічка новин з усього світу</p>
                </div>
            </header>

            <main class="main">
                <section class="sources-panel" aria-labelledby="sourcesTitle">
                    <h2 class="panel__title" id="sourcesTitle">Джерела</h2>
                    <div class="sources" role="group" aria-label="Список джерел новин"></div>
                </section>

                <section class="news-panel" aria-labelledby="newsTitle">
                    <h2 class="panel__title" id="newsTitle">Останні новини</h2>
                    <div class="news" aria-live="polite"></div>
                </section>

                <noscript class="noscript">
                    Для роботи застосунку потрібно увімкнути JavaScript у браузері.
                </noscript>
            </main>

            <footer class="footer">
                <div class="footer__inner">
                    <a
                        class="footer__link"
                        href="https://github.com/KrychVas"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path
                                fill="currentColor"
                                d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-2.1c-3.2.7-3.88-1.4-3.88-1.4-.53-1.35-1.29-1.71-1.29-1.71-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.5 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.42.36.79 1.06.79 2.14v3.17c0 .3.21.66.8.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"
                            />
                        </svg>
                        <span>KrychVas</span>
                    </a>

                    <p class="footer__year">© 2026</p>

                    <a
                        class="footer__link footer__link--course"
                        href="https://rs.school/courses/javascript"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <svg class="footer__logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
                            <circle cx="20" cy="20" r="18.5" fill="#0f2f1a" stroke="#5ad67d" stroke-width="2" />
                            <text
                                x="20"
                                y="25"
                                text-anchor="middle"
                                font-family="Segoe UI, Arial, sans-serif"
                                font-size="13"
                                font-weight="800"
                                fill="#5ad67d"
                            >
                                RS
                            </text>
                        </svg>
                        <span>RS School</span>
                    </a>
                </div>
            </footer>
        </div>

        <template id="sourceItemTemp">
            <button class="source__item" type="button" aria-pressed="false">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__media">
                    <div class="news__photo" aria-hidden="true"></div>
                    <span class="news__description-source"></span>
                </div>
                <div class="news__body">
                    <div class="news__meta">
                        <span class="news__meta-author"></span>
                        <time class="news__meta-date"></time>
                    </div>
                    <h3 class="news__description-title"></h3>
                    <p class="news__description-content"></p>
                    <a class="news__read-more" href="#" target="_blank" rel="noopener noreferrer">
                        Читати далі
                        <span class="news__read-more-arrow" aria-hidden="true">→</span>
                    </a>
                </div>
            </article>
        </template>

        <template id="skeletonTemp">
            <div class="news__item news__item--skeleton" aria-hidden="true">
                <div class="news__media skeleton-block"></div>
                <div class="news__body">
                    <div class="skeleton-line skeleton-line--short"></div>
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line skeleton-line--medium"></div>
                    <div class="skeleton-line skeleton-line--short"></div>
                </div>
            </div>
        </template>
    </body>
</html>
